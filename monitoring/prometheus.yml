# Minimal Prometheus config for HookRelay. Run alongside the stack:
#   docker run -d --name prometheus --network host \
#     -v $PWD/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml \
#     -v $PWD/monitoring/alerts.yml:/etc/prometheus/alerts.yml \
#     prom/prometheus
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: hookrelay
    static_configs:
      # Inside compose use api:9100 / worker:9100; on the host, localhost.
      - targets: ["api:9100", "worker:9100"]
